name: Auto-delete merged branches

on:
  pull_request:
    types: [closed]

jobs:
  delete-branch:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Delete merged branch
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Skip if PR was from a fork
            if (context.payload.pull_request.head.repo.full_name !== `${owner}/${repo}`) {
              console.log(`Skipping fork branch: ${branch}`);
              return;
            }

            // Skip main/master branches
            if (['main', 'master'].includes(branch)) {
              console.log(`Skipping protected branch: ${branch}`);
              return;
            }

            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${branch}`,
              });
              console.log(`Deleted branch: ${branch}`);
            } catch (error) {
              if (error.status === 422) {
                console.log(`Branch already deleted: ${branch}`);
              } else {
                throw error;
              }
            }
